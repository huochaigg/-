<body>
  <script>

    const PENDING = 'pending'
    const FULFILLED = 'fulfilled'
    const REJECTED = 'rejected'

    class MyPromise {

      #state = PENDING
      #result = undefined
      #thenables = []

      #changeState = (state, data) => {
        if (this.#state !== PENDING) return
        this.#state = state
        this.#result = data
        this.#run()
      }

      constructor(executor) {

        const resolve = (data) => {
          this.#changeState(FULFILLED, data)
        }

        const reject = (err) => {
          this.#changeState(REJECTED, err)
        }

        try {
          executor(resolve, reject)
        } catch (err) {
          reject(err)
        }
      }

      then(onFulfilled, onRejected) {
        return new MyPromise((resolve, reject) => {
          this.#thenables.push({
            onFulfilled,
            onRejected,
            resolve,
            reject
          })

          this.#run()
        })
      }

      #run() {
        if (this.#state === PENDING) return

        while (this.#thenables.length) {
          const {
            onFulfilled,
            onRejected,
            resolve,
            reject
          } = this.#thenables.shift()

          const callback = this.#state === FULFILLED ? onFulfilled : onRejected
          if (typeof callback === 'function') {
            queueMicrotask(() => {
              try {
                const data = callback(this.#result)
                resolve(data)
              } catch (err) {
                reject(err)
              }
            })
          } else {
            const reFunc = this.#state === FULFILLED ? resolve : reject
            queueMicrotask(() => {
              reFunc(this.#result)
            })
          }
        }
      }
    }


    let p = new MyPromise((resolve, reject) => {
      // resolve(123)
      reject(135)
    })

    console.log('p', p)

    p.then(res => {
      console.log('res', res)
      return 456
      // throw 789
    }, (err) => {
      console.log('err', err)
      return err
    }).then(res => {
      console.log(res)
    })


    let _result, _reject
    new Promise((result, reject) => {
      _result = result,
      _reject = reject
    })

    console.log('_result', _result, _reject)


  </script>
