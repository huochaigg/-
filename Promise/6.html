<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>

    const p1 = new Promise((resolve) => {
      resolve()
    })

    const p2 = new Promise((resolve) => {
      resolve(p1)
    })

    p2.then(() => {
      console.log(1)
    }).then(() => {
      console.log(2)
    }).then(() => {
      console.log(3)
    })

    p1.then(() => {
      console.log(4)
    }).then(() => {
      console.log(5)
    }).then(() => {
      console.log(6)
    })

    // console.log(7)

    // 4, 5, 1, 6, 2, 3
  </script>
</body>
</html>
