<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>

    const PENDING = 'PENDING'
    const FULFILLED = 'fulfilled'
    const REJECTED = 'rejected'

    class MyPromise {
      #state = PENDING
      #reson = undefined
      #thenables = []

      constructor(executor) {
        const resolve = (data) => {
          if (this.#state !== PENDING) return
          this.#state = FULFILLED
          this.#reson = data
          this.#run()
        }

        const reject = (err) => {
          if (this.#state !== PENDING) return
          this.#state = REJECTED
          this.#reson = err
          this.#run()
        }

        try {
          executor(resolve, reject)
        } catch (err) {
          reject(err)
        }
      }

      #run() {
        if (this.#state === PENDING) return 
        while (this.#thenables.length) {
          const { 
            onFulfilled,
            onRejected,
            resolve,
            reject
          } = this.#thenables.shift()
        
          const onComplate = this.#state === FULFILLED ? onFulfilled : onRejected
          if (typeof onComplate === 'function') {
            queueMicrotask(() => {
              try {
                const res = onFulfilled(this.#reson)
                resolve(res)
              } catch (err) {
                reject(err)
              }
            })
          } else {
            const reFunc = this.#state === FULFILLED ? resolve : reject
            queueMicrotask(() => {
              reFunc(this.#reson)
            })
          }
        }
      }

      then(onFulfilled, onRejected) {
        return new Promise((resolve, reject) => {
          this.#thenables.push({
            onFulfilled,
            onRejected,
            resolve,
            reject
          })

          this.#run()
        })
      }
    }

  </script>
</body>
</html>
