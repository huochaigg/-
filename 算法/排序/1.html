  <script>
    debugger
    function insertionSort(arr) {
      for (let i = 1; i < arr.length; i++) {
        const current = arr[i]
        let j = i - 1

        while (j >= 0 && arr[j] > current) {
          arr[j + 1] = arr[j]
          j--
        }

        arr[j + 1] = current
      }

      return arr
    }

    console.log(insertionSort([7, 3, 8, 2, 6, 4, 5]))

  </script>
