<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myInstanceof</title>
</head>
<body>
  <script>
    /**
     * a instanceof Ctor
     * 沿 a 的原型链往上走，看有没有 Ctor.prototype
     */
    function myInstanceof(left, right) {
      if (typeof right !== 'function') {
        throw new TypeError('Right-hand side of instanceof is not callable')
      }
      if (left == null || (typeof left !== 'object' && typeof left !== 'function')) {
        return false
      }

      let proto = Object.getPrototypeOf(left)
      const prototype = right.prototype

      while (proto) {
        if (proto === prototype) return true
        proto = Object.getPrototypeOf(proto)
      }
      return false
    }

    function Person() {}
    const p = new Person()

    console.log(myInstanceof(p, Person), myInstanceof(p, Object))
    console.log(myInstanceof([], Array), myInstanceof([], Object))
    console.log(myInstanceof(1, Number))       // false，原始值
    console.log(myInstanceof(null, Object))    // false
    console.log(myInstanceof(Person, Function)) // true，函数也是对象
  </script>
</body>
</html>
