<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduler</title>
</head>
<body>
  <script>
    /**
     * 任务调度器：随时 add 任务，内部保证最多 limit 个同时执行
     * 和 asyncPool 的区别：asyncPool 一次性吃完整数组；Scheduler 可边生产边消费
     */
    class Scheduler {
      constructor(limit = 2) {
        this.limit = limit
        this.running = 0
        this.queue = []
      }

      /**
       * @param {() => Promise} taskFn 返回 Promise 的函数（不要直接传已在跑的 Promise）
       * @returns {Promise} 该任务自己的完成结果
       */
      add(taskFn) {
        return new Promise((resolve, reject) => {
          this.queue.push(() => {
            return Promise.resolve()
              .then(() => taskFn())
              .then(resolve, reject)
          })
          this.#run()
        })
      }

      #run() {
        while (this.running < this.limit && this.queue.length > 0) {
          const task = this.queue.shift()
          this.running++
          task().finally(() => {
            this.running--
            this.#run()
          })
        }
      }
    }

    // ---------- 演示：经典面试用例 ----------
    // 要求输出顺序：2 3 1 4（timeout 小的先完成，但同时最多 2 个）
    const scheduler = new Scheduler(2)

    const timeout = (time) => new Promise(resolve => setTimeout(resolve, time))

    const addTask = (time, order) => {
      scheduler.add(() => timeout(time)).then(() => console.log(order))
    }

    addTask(1000, '1')
    addTask(500, '2')
    addTask(300, '3')
    addTask(400, '4')
    // 预期：2 3 1 4

    // ---------- 若还要「最终结果数组按 add 顺序」----------
    // 外层自己收集 Promise 即可（Scheduler 保证并发，顺序由调用方 Promise.all 保）
    async function demoOrdered() {
      const s = new Scheduler(5)
      const jobs = Array.from({ length: 10 }, (_, i) => i)

      const promises = jobs.map(id =>
        s.add(async () => {
          await timeout(50 + Math.random() * 100)
          return `res-${id}`
        })
      )

      const results = await Promise.all(promises)
      console.log('按 add 顺序的结果 →', results)
    }

    setTimeout(demoOrdered, 2500)
  </script>
</body>
</html>
