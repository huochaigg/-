<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>asyncPool</title>
</head>
<body>
  <script>
    /**
     * 并发池：最多同时跑 poolLimit 个，最终结果顺序与入参数组一致
     * @param {number} poolLimit 最大并发数
     * @param {Array} array 任务参数列表（如 100 个 url）
     * @param {(item, array) => Promise} iteratorFn 每个元素对应的异步任务
     */
    async function asyncPool(poolLimit, array, iteratorFn) {
      const ret = []       // 按入参顺序保存每个任务的 Promise（保证最终顺序）
      const executing = [] // 当前正在执行的任务

      for (const item of array) {
        // 立刻创建 Promise，但真正干活的是 iteratorFn
        const p = Promise.resolve().then(() => iteratorFn(item, array))
        ret.push(p)

        if (poolLimit <= array.length) {
          // 任务结束时从 executing 里摘掉，腾出并发名额
          const e = p.then(() => executing.splice(executing.indexOf(e), 1))
          executing.push(e)

          if (executing.length >= poolLimit) {
            // 池子满了：等任意一个完成，再继续开新任务
            await Promise.race(executing)
          }
        }
      }

      // 等全部完成；ret 按下标排列，顺序 = 入参顺序
      return Promise.all(ret)
    }

    // ---------- 演示：最多同时 5 个 ----------
    // 预期观感：
    // 1) 一开始连续「开始」到并发=5，然后卡住等
    // 2) 之后通常是「结束一个 → 立刻补一个」，并发在 4↔5 之间抖
    // 3) 若多个任务耗时几乎一样（比如都写死 5000ms），会先刷一串结束，再刷一串开始——
    //    看起来像「又一批」，但峰值并发仍然 <= 5，不是一次真的跑了 10 个
    let running = 0
    let maxRunning = 0
    const t0 = Date.now()
    const stamp = () => `+${String(Date.now() - t0).padStart(4, ' ')}ms`
    const bar = (n) => '█'.repeat(n) + '░'.repeat(5 - n)

    const tasks = Array.from({ length: 20 }, (_, i) => i)

    asyncPool(5, tasks, (id) => {
      running++
      maxRunning = Math.max(maxRunning, running)
      console.log(`${stamp()} 开始 #${id}  [${bar(running)}] 并发=${running}`)

      // 用「错开」的耗时更容易看出补位；改成固定值会变成整波一起结束再整波开始
      const ms = 800 + id * 120
      return new Promise(resolve => {
        setTimeout(() => {
          running--
          console.log(`${stamp()} 结束 #${id}  [${bar(running)}] 并发=${running}`)
          resolve(`res-${id}`)
        }, ms)
      })
    }).then(results => {
      console.log('结果顺序 →', results)
      console.log('过程中最大并发 →', maxRunning) // 应 <= 5
    })
  </script>
</body>
</html>
