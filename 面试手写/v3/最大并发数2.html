<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>最大并发数 重写</title>
</head>
<body>
  <script>

    function concurRequest(urls, maxNum) {
      return new Promise((resolve, reject) => {
        if (urls.length === 0) {
          resolve([])
          return 
        }
        const result = []
        const len = urls.length
        let index = 0
        let finished = 0
        async function request() {
          if (index >= len) return
          const i = index
          index ++
          try {
            const url = urls[i]
            const res = await fetch(url)
            result[i] = res
          } catch(err) {
            result[i] = err
          } finally {
            finished ++
            if (finished >= len) {
              resolve(result)
              return
            } 
            if (index >= len) {
              return
            }
            request()
          }
        }

        const reqLen = Math.min(maxNum, len)
        for (let i = 0; i < reqLen; i ++) {
          request()
        }
      })
    }

    const requestUrls = []
    
    for(let i = 0; i < 10; i++) {
      requestUrls.push(`http://localhost:3333/test?id=${i}`)
    }
    console.log('requestUrls', requestUrls)
    concurRequest(requestUrls, 3).then(res => {
      console.log('concurRequest', res)
    })
  
  </script>
</body>
</html>
