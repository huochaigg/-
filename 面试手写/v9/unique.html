<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数组去重</title>
</head>
<body>
  <script>
    /** Set：引用不同的对象不会合并；NaN 只留一个 */
    function uniqueSet(arr) {
      return [...new Set(arr)]
    }

    /** reduce + includes：好讲思路，对象同样是引用比较 */
    function uniqueReduce(arr) {
      return arr.reduce((acc, cur) => {
        if (!acc.includes(cur)) acc.push(cur)
        return acc
      }, [])
    }

    /** 先扁平再去重 */
    function flatUnique(arr) {
      const flat = arr.flat(Infinity)
      return [...new Set(flat)]
    }

    /**
     * 按对象某个值去重（保留第一次出现）
     * key 可以是字段名，或取键函数 (item) => item.id
     */
    function uniqueBy(arr, key) {
      const seen = new Set()
      const getKey = typeof key === 'function' ? key : (item) => item[key]
      return arr.filter(item => {
        const k = getKey(item)
        if (seen.has(k)) return false
        seen.add(k)
        return true
      })
    }

    const list = [1, 2, 2, 3, NaN, NaN, 'a', 'a']
    console.log('Set', uniqueSet(list))
    console.log('reduce', uniqueReduce(list))

    const a = { x: 1 }
    console.log('对象按引用', uniqueSet([a, a, { x: 1 }])) // 两个 {x:1}，后者是另一份

    console.log('扁平再去重', flatUnique([1, [2, [2, 3]], 1]))

    const users = [
      { id: 1, name: 'tom' },
      { id: 2, name: 'jerry' },
      { id: 1, name: 'tom2' }, // id 重复，丢掉
      { id: 3, name: 'spike' }
    ]
    console.log('按 id 去重', uniqueBy(users, 'id'))
    console.log('按 name 去重', uniqueBy(users, 'name'))
    console.log('按函数取键', uniqueBy(users, (u) => u.id))
  </script>
</body>
</html>
