<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>快慢指针找中点</title>
</head>
<body>
  <script>
    function ListNode(value, next = null) {
      this.value = value
      this.next = next
    }
    function fromArray(arr) {
      const dummy = new ListNode(0)
      let cur = dummy
      for (const v of arr) { cur.next = new ListNode(v); cur = cur.next }
      return dummy.next
    }

    /**
     * slow 一步，fast 两步。一遍扫完。
     * 循环条件 fast && fast.next：否则走不了两步
     * 偶数长度：本实现返回「后一个中点」
     * 1..5 → 3；1..6 → 4
     */
    function middleNode(head) {
      let slow = head
      let fast = head
      while (fast && fast.next) {
        slow = slow.next
        fast = fast.next.next
      }
      return slow
    }

    console.log(middleNode(fromArray([1, 2, 3, 4, 5])).value)    // 3
    console.log(middleNode(fromArray([1, 2, 3, 4, 5, 6])).value) // 4
  </script>
</body>
</html>
