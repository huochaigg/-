<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合并两个有序链表 · 加餐</title>
</head>
<body>
  <script>
    function ListNode(value, next = null) {
      this.value = value
      this.next = next
    }
    function fromArray(arr) {
      const dummy = new ListNode(0)
      let cur = dummy
      for (const v of arr) { cur.next = new ListNode(v); cur = cur.next }
      return dummy.next
    }
    function toArray(head) {
      const r = []
      while (head) { r.push(head.value); head = head.next }
      return r
    }

    function mergeTwoLists(l1, l2) {
      const dummy = new ListNode(0)
      let tail = dummy
      while (l1 && l2) {
        if (l1.value <= l2.value) {
          tail.next = l1
          l1 = l1.next
        } else {
          tail.next = l2
          l2 = l2.next
        }
        tail = tail.next
      }
      tail.next = l1 || l2
      return dummy.next
    }

    console.log(toArray(mergeTwoLists(fromArray([1, 3, 5]), fromArray([2, 4, 6]))))
  </script>
</body>
</html>
