<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>删除链表节点</title>
</head>
<body>
  <script>
    function ListNode(value, next = null) {
      this.value = value
      this.next = next
    }
    function fromArray(arr) {
      const dummy = new ListNode(0)
      let cur = dummy
      for (const v of arr) { cur.next = new ListNode(v); cur = cur.next }
      return dummy.next
    }
    function toArray(head) {
      const r = []
      while (head) { r.push(head.value); head = head.next }
      return r
    }

    /**
     * 删除第一个 value === target
     * 改链接本身 O(1)，但找到前驱是 O(n)
     * dummy：头节点也可能被删，统一成「删 prev 后面那个」
     */
    function deleteValue(head, target) {
      const dummy = new ListNode(0, head)
      let prev = dummy
      while (prev.next) {
        if (prev.next.value === target) {
          prev.next = prev.next.next
          break
        }
        prev = prev.next
      }
      return dummy.next
    }

    console.log(toArray(deleteValue(fromArray([1, 2, 3]), 2))) // [1, 3]
    console.log(toArray(deleteValue(fromArray([1, 2, 3]), 1))) // [2, 3] 删头
    console.log(toArray(deleteValue(fromArray([1, 2, 3]), 9))) // [1, 2, 3]
  </script>
</body>
</html>
