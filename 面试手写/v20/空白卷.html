    // ---------- 自测 ----------
    function TreeNode(val, left = null, right = null) {
      this.val = val; this.left = left; this.right = right
    }
    function ListNode(value, next = null) {
      this.value = value; this.next = next
    }
    function listFrom(arr, pos = -1) {
      const dummy = new ListNode(0)
      let cur = dummy
      const nodes = []
      for (const v of arr) { cur.next = new ListNode(v); cur = cur.next; nodes.push(cur) }
      if (pos >= 0) cur.next = nodes[pos]
      return dummy.next
    }
    function toArr(head) {
      const r = []; const seen = new Set()
      while (head && !seen.has(head)) { seen.add(head); r.push(head.value); head = head.next }
      return r
    }

    const list = [
      { id: 4, parentId: 2, name: 'D' },
      { id: 2, parentId: 1, name: 'B' },
      { id: 3, parentId: 1, name: 'C' },
