<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V22 要点：双指针</title>
</head>
<body>
  <script>
    /*
     * ========== V22 面试口径 ==========
     *
     * 双指针 = 同时维护两个位置，按条件移动其中一个或两个，减少重复扫描。
     * 不是固定一套代码。
     *
     * 你已经用过：链表中点 / 环 1:2；倒数 K 固定距离。
     *
     * 数组三类：
     * 快慢指针  都从左往右，职责不同 —— 移动零、删重复、删 val
     * 左右指针  一头一尾夹逼 —— 回文、有序 Two Sum
     * 两数组各一指针 —— 合并有序数组（常从后往前）
     *
     * slow = 已处理好区域的边界；fast = 探索未知。
     *
     * 为何常是 O(n) 不是 O(n²)：每个指针通常只朝一个方向走，合计最多约 2n。
     *
     * 关键词：有序、原地、回文、左右比较、中点、倒数 K、去重、移零、合并有序。
     * 滑动窗口（V23）= left/right 明确维护一个区间，是双指针的特殊模型。
     */
  </script>
</body>
</html>
