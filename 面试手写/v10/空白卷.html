  <script>
    /* =========================================================
     * 推荐顺序（先四道核心）：
     * 1 Promise.all → 2 并发控制 → 3 EventEmitter → 4 bind
     * 再：5 debounce → 6 deepClone → 7 new/instanceof → 8 flat
     * 最后：9 Event Loop 口算 → 10 生图场景只讲设计
     * ========================================================= */

    // ---------- 1. myPromiseAll  目标 8～10 min  状态：
    // 输入 [Promise.resolve(1), 2, Promise.resolve(3)] → [1, 2, 3]
    // 保序、普通值、全成才成、一败立刻 reject、[] 立刻 []
    // 为什么不能 result.push(value)？
    function myPromiseAll(arr) {
      if (!Array.isArray(arr)) Promise.reject(new TypeError('need array'))
      return new Promise((resolve, reject) => {
        if (arr.length === 0) resolve([])
        let result = []
        let count = 0
        for (let i = 0; i < arr.length; i ++) {
          Promise.resolve(arr[i]).then(res => {
            result[i] = res
            count ++
            if (count === arr.length) {
              resolve(result)
            }
          }, reject)
        }
      })
    }

    // ---------- 2. asyncPool / 最大并发  目标 ≤15 min  状态：
    // tasks 是 () => Promise 的数组，limit=3，结果顺序 = tasks 顺序
    // 失败策略自己选并在注释里写一句：立刻 reject 整池 / 错误放进 result 继续
    function asyncPool(tasks, limit) {
      // 失败策略：错误放进 result 继续，整池仍 resolve
      return new Promise((resolve, reject) => {
        const len = tasks.length
        if (len === 0) {
          resolve([])
          return
        }

        const result = []
        let index = 0
        let finished = 0
        async function request() {
          if (index >= len) return
          const i = index++
          try {
            // tasks[i] 是 () => Promise，要调用后再 await
            result[i] = await tasks[i]()
          } catch (err) {
            result[i] = err
          } finally {
            finished++
            if (finished >= len) {
              resolve(result)
              return
            }
            request()
          }
        }

        const maxReqLen = Math.min(limit, len)
        for (let i = 0; i < maxReqLen; i++) {
          request()
        }
      })
    }

    // ---------- 3. EventEmitter  目标 10～15 min  状态：
    // on / emit / off / once
    class EventEmitter {
      #events = []
      on(event, fn) {
        if (!this.#events[event]) {
          this.#events[event] = []
        }
        this.#events.push(fn)
        return () => this.off(event, fn)
      }
      
      emit(event, ...args) {
        if (this.#events.event) {
          this.#events[event].slice().forEach(fn => {
            fn.appay(this, ...args)
          })
        }
      }

      off(event, fn) {
        const list = this.#events[event]
        if (list.length === 0) return
        this.#events[event] = list.filter(item => item !== event)
      }

      once(event, fn) {
        const wrapper = (...args) => {
          this.off(event, wrapper)
          fn.appay(this, args)
        }

        this.on(event. wrapper)
      }
    }
    // 口答（写在这里）：发布订阅为什么适合 Node？和观察者差在哪？

    // ---------- 4. myBind  目标 10～15 min  状态：
    // 改 this、预置参数、后续参数、new boundFn() 时忽略 bind 的 this
    Function.prototype.myBind = function (context, ...boundArgs) {
      if (typeof this !== 'function') throw TypeError('必须function')
      const fn = this
      const bindContext = context === null ? globalThis : context

      return function (...args) {
        if (new.target) {
          return new fn([...boundArgs, ...args])
        }
        return fn.apply(bindContext, [...boundArgs, ...args])
      }
    }

    // ---------- 5. debounce  目标 5～8 min  状态：
    // 停 delay 后执行一次；保留 this 和 args
    // 进阶：immediate = true 第一次立刻执行
    function debounce(fn, delay, immediate = false) {
      let timer = null
      return function (...args) {
        if (immediate && !timer) {
          fn.appay(this, args)
        }
        if (timer) clearTimeout(timer)
        timer = setTimeout(() => {
          time = null
          if (!immediate) {
            fn.appay(this, args)
          }
        }, delay)
      }
    }

    // ---------- 6. deepClone  目标 ~15 min  状态：
    // Object Array Date RegExp Map Set + WeakMap 循环引用
    function deepClone(val, map = new WeakMap()) {
      if (val === null || typeof val !== "object") {
        return val
      }
      if (val instanceof RegExp) {
        return new RegExp(val)
      } 
      if (val instanceof Date) {
        return new Date(val)
      }
      if (val instanceof Map) {
        const cloned = new Map()
        map.set(val, cloned)
        val.forEach((v, k) => cloned.set(deepClone(k, map), deepClone(v, map)))
        return cloned
      }
      if (val instanceof Set) {
        const cloned = new Set()
        map.set(val, cloned)
        val.forEach(v => cloned.add(deepClone(v, map)))
        return cloned
      }
      const c = Array.isArray(val) ? [] : Object.create(Object.getPrototypeOf(val))
      if (map.get(val)) return val
      map.set(val, c)
      Reflect.ownKeys(val).forEach(k => {
        c[k] = deepClone(val[k], map)
      })
      return c
    }

    // ---------- 7. myNew + myInstanceof  目标 ~10 min  状态：
    function myNew(Ctor, ...args) {
      const obj = Object.create(Ctor.prototype)
      const ret = Ctor.apply(this, args)
      const isObj = ret !== null && (typeof ret ==="object" || typeof ret === 'function')
      return isObj ? ret : obj
    }
    function myInstanceof(left, right) {
      if (typeof right !== 'function') throw new TypeError('not callable')
      if (left === null || (typeof left !== 'object' && typeof left !== 'function')) return false

      let proto = Object.getPrototypeOf(left)
      while(proto) {
        if (proto === right.prototype) {
          return true
        }
        proto = Object.getPrototypeOf(proto)
      }
      return false
    } 

    // ---------- 8. myFlat  目标 5～8 min  状态：
    // depth 可为 Infinity；至少递归版。加分：栈、不许递归
    function myFlat(arr, depth = 1) {
      debugger
      const result = []
      // 每个元素记下「还能再展几层」
      const stack = arr.map(val => ({ val, d: depth }))
      while (stack.length) {
        const { val, d } = stack.shift()
        if (Array.isArray(val) && d > 0) {
          // 从队头展开：倒序 unshift，保证左→右顺序
          for (let i = val.length - 1; i >= 0; i--) {
            stack.unshift({ val: val[i], d: d - 1 })
          }
        } else {
          result.push(val) // 非数组，或 depth 用尽（保留内层数组）
        }
      }
      return result
    }

    // ---------- 9. Event Loop 口算  状态：

    // ====================== 自测（实现后再看控制台） ======================
    function delay(ms, v) {
      return new Promise(r => setTimeout(() => r(v), ms))
    }
    function fail(ms, e) {
      return new Promise((_, rj) => setTimeout(() => rj(e), ms))
    }

    async function runTests() {
      console.log('===== 自测开始（没写完会报错，正常）=====')

      try {
        const allRes = await myPromiseAll([Promise.resolve(1), 2, Promise.resolve(3)])
        console.log('all 顺序/普通值', JSON.stringify(allRes) === '[1,2,3]' ? 'OK' : allRes)
        const empty = await myPromiseAll([])
        console.log('all []', Array.isArray(empty) && empty.length === 0 ? 'OK' : empty)
        await myPromiseAll([Promise.resolve(1), Promise.reject('x')]).then(
          () => console.log('all 失败应 reject，但成功了'),
          err => console.log('all reject', err === 'x' ? 'OK' : err)
        )
      } catch (e) { console.log('all 未完成', e.message || e) }

      try {
        let peak = 0, cur = 0
        const tasks = [0, 1, 2, 3, 4].map(i => () => {
          cur++
          peak = Math.max(peak, cur)
          return delay(30 + (4 - i) * 10, i).finally(() => cur--)
        })
        const poolRes = await asyncPool(tasks, 3)
        console.log('pool 结果顺序', JSON.stringify(poolRes) === '[0,1,2,3,4]' ? 'OK' : poolRes)
        console.log('pool 峰值并发 <=3', peak <= 3 ? 'OK peak=' + peak : 'FAIL peak=' + peak)
      } catch (e) { console.log('pool 未完成', e.message || e) }

      try {
        const bus = new EventEmitter()
        const logs = []
        const a = (x, y) => logs.push('a' + x + y)
        const b = (x, y) => logs.push('b' + x + y)
        bus.on('message', a)
        bus.on('message', b)
        bus.once('message', (x, y) => logs.push('once' + x + y))
        bus.emit('message', 1, 2)
        bus.off('message', a)
        bus.emit('message', 3, 4)
        console.log('EventEmitter', logs.join(',') === 'a12,b12,once12,b34' ? 'OK' : logs)
      } catch (e) { console.log('EventEmitter 未完成', e.message || e) }

      try {
        function add(a, b, c, d) { return [this.n, a, b, c, d] }
        const fn2 = add.myBind({ n: 9 }, 1, 2)
        const callRes = fn2(3, 4)
        console.log('bind 预置参数', JSON.stringify(callRes) === '[9,1,2,3,4]' ? 'OK' : callRes)

        function Person(name) { this.name = name }

      } catch (e) { console.log('bind 未完成', e.message || e) }

      try {
        const obj = { n: 1, d: new Date('2020-01-01'), r: /ab/g, arr: [1], m: new Map([['a', 1]]), s: new Set([1]) }
        obj.self = obj
        const c = deepClone(obj)
        const ok = c !== obj && c.self === c && c.d !== obj.d && c.r.source === 'ab' && c.m.get('a') === 1 && c.s.has(1)
        console.log('deepClone', ok ? 'OK' : c)
      } catch (e) { console.log('deepClone 未完成', e.message || e) }

      try {
        function Ctor(name) { this.name = name }
        Ctor.prototype.k = 1
        const n = myNew(Ctor, 'a')
        console.log('myNew', n.name === 'a' && n.k === 1 ? 'OK' : n)
        function Ret() { return { hijack: true } }
        console.log('myNew return 对象', myNew(Ret).hijack === true ? 'OK' : myNew(Ret))
        console.log('instanceof', myInstanceof(n, Ctor) && myInstanceof(n, Object) && !myInstanceof(1, Number) ? 'OK' : 'FAIL')
      } catch (e) { console.log('new/instanceof 未完成', e.message || e) }

      try {
        const arr = [1, [2, [3]]]
        console.log(myFlat(arr, 2))
        console.log('flat 1', JSON.stringify(myFlat(arr, 1)) === '[1,2,[3]]' ? 'OK' : myFlat(arr, 1))
        console.log('flat Infinity', JSON.stringify(myFlat(arr, Infinity)) === '[1,2,3]' ? 'OK' : myFlat(arr, Infinity))
      } catch (e) { console.log('flat 未完成', e.message || e) }

      console.log('===== 自测结束 =====')
    }
