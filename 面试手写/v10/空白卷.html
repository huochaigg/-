    function delay(ms, v) {
      return new Promise(r => setTimeout(() => r(v), ms))
    }

    }

      } catch (e) { console.log('all 未完成', e.message || e) }

      try {
        let peak = 0, cur = 0
        const tasks = [0, 1, 2, 3, 4].map(i => () => {
          cur++
          peak = Math.max(peak, cur)
          return delay(30 + (4 - i) * 10, i).finally(() => cur--)
        })
        const poolRes = await asyncPool(tasks, 3)
        console.log('pool 结果顺序', JSON.stringify(poolRes) === '[0,1,2,3,4]' ? 'OK' : poolRes)

        const bus = new EventEmitter()
        const logs = []
        const a = (x, y) => logs.push('a' + x + y)
        const b = (x, y) => logs.push('b' + x + y)
        bus.on('message', a)
        bus.on('message', b)
        bus.once('message', (x, y) => logs.push('once' + x + y))
        bus.emit('message', 1, 2)
        bus.off('message', a)
        bus.emit('message', 3, 4)
        console.log('EventEmitter', logs.join(',') === 'a12,b12,once12,b34' ? 'OK' : logs)
      } catch (e) { console.log('EventEmitter 未完成', e.message || e) }

      try {
        function add(a, b, c, d) { return [this.n, a, b, c, d] }
        const fn2 = add.myBind({ n: 9 }, 1, 2)
        const callRes = fn2(3, 4)
        console.log('bind 预置参数', JSON.stringify(callRes) === '[9,1,2,3,4]' ? 'OK' : callRes)

        function Person(name) { this.name = name }
        Person.prototype.hi = function () { return this.name }
        const Bound = Person.myBind({ x: 1 }, 'tom')
        const p = new Bound()
        console.log('new bind', p instanceof Person && p.hi() === 'tom' && p.x === undefined ? 'OK' : p)
      } catch (e) { console.log('bind 未完成', e.message || e) }

      try {

        obj.self = obj
        const c = deepClone(obj)
        const ok = c !== obj && c.self === c && c.d !== obj.d && c.r.source === 'ab' && c.m.get('a') === 1 && c.s.has(1)
        console.log('deepClone', ok ? 'OK' : c)
      } catch (e) { console.log('deepClone 未完成', e.message || e) }

      try {

        Ctor.prototype.k = 1
        const n = myNew(Ctor, 'a')
        console.log('myNew', n.name === 'a' && n.k === 1 ? 'OK' : n)
        function Ret() { return { hijack: true } }
        console.log('myNew return 对象', myNew(Ret).hijack === true ? 'OK' : myNew(Ret))
        console.log('instanceof', myInstanceof(n, Ctor) && myInstanceof(n, Object) && !myInstanceof(1, Number) ? 'OK' : 'FAIL')
