<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V10 参考答案 · 做完空白卷再看</title>
</head>
<body>
  <p>对照用。原理仍以 V2～V9 要点为准。</p>
  <script>
    function myPromiseAll(arr) {
      if (!Array.isArray(arr)) return Promise.reject(new TypeError('need array'))
      return new Promise((resolve, reject) => {
        const len = arr.length
        if (len === 0) { resolve([]); return }
        let count = 0
        const results = new Array(len)
        for (let i = 0; i < len; i++) {
          Promise.resolve(arr[i]).then(v => {
            results[i] = v
            if (++count === len) resolve(results)
          }, reject)
        }
      })
    }

    function asyncPool(tasks, limit) {
      return new Promise((resolve, reject) => {
        const len = tasks.length
        if (len === 0) { resolve([]); return }
        const results = new Array(len)
        let next = 0
        let running = 0
        let settled = false

        const run = () => {
          if (settled) return
          if (next >= len && running === 0) {
            settled = true
            resolve(results)
            return
          }
          while (running < limit && next < len) {
            const i = next++
            running++
            Promise.resolve()
              .then(() => tasks[i]())
              .then(v => { results[i] = v }, reject) // 立刻整池失败；要降级可改成 results[i] = err
              .finally(() => {
                running--
                run()
              })
          }
        }
        run()
      })
    }

    class EventEmitter {
      constructor() { this.events = Object.create(null) }
      on(type, fn) {
        if (!this.events[type]) this.events[type] = []
        this.events[type].push(fn)
        return () => this.off(type, fn)
      }
      off(type, fn) {
        const list = this.events[type]
        if (!list) return
        if (!fn) { delete this.events[type]; return }
        this.events[type] = list.filter(x => x !== fn && x.origin !== fn)
      }
      once(type, fn) {
        const wrap = (...args) => {
          this.off(type, wrap)
          fn.apply(this, args)
        }
        wrap.origin = fn
        this.on(type, wrap)
      }
      emit(type, ...args) {
        const list = this.events[type]
        if (!list) return
        list.slice().forEach(fn => fn.apply(this, args))
      }
    }

    Function.prototype.myBind = function (context, ...boundArgs) {
      if (typeof this !== 'function') throw new TypeError('not a function')
      const fn = this
      const boundContext = context == null ? globalThis : context
      function boundFn(...args) {
        const ctx = this instanceof boundFn ? this : boundContext
        return fn.apply(ctx, [...boundArgs, ...args])
      }
      const Empty = function () {}
      if (fn.prototype) {
        Empty.prototype = fn.prototype
        boundFn.prototype = new Empty()
      }
      return boundFn
    }

    function debounce(fn, delay, immediate = false) {
      let timer = null
      return function (...args) {
        const callNow = immediate && !timer
        clearTimeout(timer)
        timer = setTimeout(() => {
          timer = null
          if (!immediate) fn.apply(this, args)
        }, delay)
        if (callNow) fn.apply(this, args)
      }
    }

    function deepClone(val, map = new WeakMap()) {
      if (val === null || typeof val !== 'object') return val
      if (map.has(val)) return map.get(val)
      if (val instanceof Date) return new Date(val)
      if (val instanceof RegExp) return new RegExp(val.source, val.flags)
      if (val instanceof Map) {
        const c = new Map()
        map.set(val, c)
        val.forEach((v, k) => c.set(deepClone(k, map), deepClone(v, map)))
        return c
      }
      if (val instanceof Set) {
        const c = new Set()
        map.set(val, c)
        val.forEach(v => c.add(deepClone(v, map)))
        return c
      }
      const c = Array.isArray(val) ? [] : Object.create(Object.getPrototypeOf(val))
      map.set(val, c)
      Reflect.ownKeys(val).forEach(k => { c[k] = deepClone(val[k], map) })
      return c
    }

    function myNew(Ctor, ...args) {
      const obj = Object.create(Ctor.prototype)
      const ret = Ctor.apply(obj, args)
      const isObj = ret !== null && (typeof ret === 'object' || typeof ret === 'function')
      return isObj ? ret : obj
    }

    function myInstanceof(left, right) {
      if (typeof right !== 'function') throw new TypeError('not callable')
      if (left == null || (typeof left !== 'object' && typeof left !== 'function')) return false
      let proto = Object.getPrototypeOf(left)
      while (proto) {
        if (proto === right.prototype) return true
        proto = Object.getPrototypeOf(proto)
      }
      return false
    }

    function myFlat(arr, depth = 1) {
      if (!Array.isArray(arr) || depth <= 0) return arr
      const result = []
      for (const item of arr) {
        if (Array.isArray(item) && depth > 0) result.push(...myFlat(item, depth - 1))
        else result.push(item)
      }
      return result
    }

    // 不许递归的 flat：栈
    function myFlatStack(arr, depth = 1) {
      const stack = arr.map(item => ({ item, d: depth }))
      const result = []
      while (stack.length) {
        const { item, d } = stack.pop()
        if (Array.isArray(item) && d > 0) {
          for (let i = item.length - 1; i >= 0; i--) stack.push({ item: item[i], d: d - 1 })
        } else result.push(item)
      }
      return result
    }

    console.log('参考答案已加载。浏览器 Event Loop：1 → 3,4 → 2')
    console.log('生图：task = retry(() => timeout(generate(i), 30000), { times: 3, delay })；外层 asyncPool(tasks, 3)；result[i] = { index, status, url/error }')
  </script>
