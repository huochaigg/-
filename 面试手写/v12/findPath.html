<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>findPath</title>
</head>
<body>
  <script>
    /**
     * 回溯：push → 递归 → 没找到就 pop
     * 选择 / 递归 / 撤销。找到就一路 true 往上传，path 不用再 pop
     */
    function findPath(tree, id) {
      const path = []

      const dfs = (nodes) => {
        for (const node of nodes || []) {
          path.push(node.id)
          if (node.id === id) return true
          if (dfs(node.children)) return true
          path.pop()
        }
        return false
      }

      return dfs(tree) ? path : null
    }

    const tree = [
      {
        id: 1, name: 'A',
        children: [
          { id: 2, name: 'B', children: [{ id: 4, name: 'D', children: [] }] },
          { id: 3, name: 'C', children: [] }
        ]
      }
    ]

    console.log('D 的路径', findPath(tree, 4)) // [1, 2, 4]
    console.log('C 的路径', findPath(tree, 3)) // [1, 3]
    console.log('没有', findPath(tree, 99))    // null
  </script>
</body>
</html>
