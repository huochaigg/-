<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V12 练习 · 先自己写</title>
</head>
<body>
  <p>四道必写：treeToList / findNode / findPath / getLeafNodes。findPath 最重要。</p>
  <script>
    const tree = [
      {
        id: 1, name: 'A',
        children: [
          { id: 2, name: 'B', children: [{ id: 4, name: 'D', children: [] }] },
          { id: 3, name: 'C', children: [] }
        ]
      }
    ]

    function treeToList(tree, parentId = null) {
      const result = []
      for (const item of tree) {
        result.push({
          id: item.id,
          name: item.name,
          parentId: parentId
        })
        if (Array.isArray(item.children)) {
          result.push(...treeToList(item.children, item.id))
        }
      }
      return result
    }
    function findNode(tree, id) {
      for (const item of tree || []) {
        if (item.id === id) {
          return item
        }
        const found = findNode(item.children)
        if (found) {
          return found
        }
      }
    }
    function findPath(tree, id) {
      const path = []
      function dfs(tree) {
        for (const item of tree) {
          path.push(item.id)
          if (item.id === id) return true
          if (dfs(item.children)) return true
          path.pop()
        }
      }
      return dfs(tree) ? path : []
    }
    function getLeafNodes(tree) {
      const result = []
      function walk(tree) {
        for (const item of tree) {
          if (!item.children || item.children.length === 0) {
            result.push(item.id)
          }
          walk(item.children)
        }
      }
      walk(tree)
      return result
    }

    console.log('list', treeToList(tree))
    console.log('node 4', findNode(tree, 4))
    console.log('path 4', findPath(tree, 4)) // 期望 [1, 2, 4]
    console.log('leaves', getLeafNodes(tree))
  </script>
</body>
</html>
