<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>treeToList</title>
</head>
<body>
  <script>
    /**
     * DFS：访问当前 → 再深入 children
     * 顺序 A B D C（先深后广）
     * 时间 O(n)，空间 O(n) + 递归栈 O(h)
     */
    function treeToList(tree) {
      const result = []
      const walk = (nodes) => {
        for (const node of nodes || []) {
          const { children, ...item } = node
          result.push(item)
          walk(children)
        }
      }
      walk(tree)
      return result
    }

    const tree = [
      {
        id: 1, name: 'A',
        children: [
          { id: 2, name: 'B', children: [{ id: 4, name: 'D', children: [] }] },
          { id: 3, name: 'C', children: [] }
        ]
      }
    ]

    console.log(treeToList(tree))
    // [{id:1,name:'A'}, {id:2,name:'B'}, {id:4,name:'D'}, {id:3,name:'C'}]
  </script>
</body>
</html>
