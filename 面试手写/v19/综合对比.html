<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>栈 vs 队列 vs DFS</title>
</head>
<body>
  <script>
    /*
     * Stack LIFO 后进先出：DFS、括号、Undo、调用栈
     * Queue FIFO 先进先出：BFS、任务队列、消息排队
     *
     * 「最后进的先处理」→ Stack
     * 「先来的先处理」→ Queue
     *
     * DFS 把后发现的深层节点压栈，所以后进先出正合适。
     *
     * 方法                 时间            空间     优先级
     * Stack 基本操作       O(1)            O(n)     S
     * 有效括号             O(n)            O(n)     S 必须 5 分钟裸写
     * MinStack             单次 O(1)       O(n)     A
     * 删除相邻重复         O(n)            O(n)     B
     * DFS 显式 Stack       O(n)            最坏 O(n) S
     */
  </script>
</body>
</html>
