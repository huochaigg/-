<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>call / apply / bind 与 this</title>
</head>
<body>
  <script>
    /*
     * ========== V7 面试口径 ==========
     *
     * this 不是「函数写在哪」决定的，是「怎么被调用」决定的（箭头函数除外）
     * 可运行例子见同目录 this复习.html
     *
     * ---------- this 判定优先级（高 → 低）----------
     * 1. new：this = 新创建的对象
     * 2. call / apply / bind：this = 你传入的对象（null/undefined → globalThis）
     * 3. 对象方法：obj.fn() → this = 点前面那个对象（obj.child.fn() 是 child）
     * 4. 独立调用 fn()：严格模式 undefined，非严格 globalThis
     *
     * ---------- 箭头函数 ----------
     * 没有自己的 this / arguments / new.target，不能 new
     * this 在定义时捕获外层普通函数 / 类实例的 this
     * call / apply / bind 改不了箭头的 this
     * 对象字面量里直接写 arrow: () => this 不会指向该对象（外层是脚本）
     * 写在 method() { const f = () => this } 里才会指向 method 的 this
     *
     * ---------- 最容易丢 this 的场景 ----------
     * const fn = obj.show; fn()
     * setTimeout(obj.show, 0)
     * arr.forEach(obj.show)
     * 按钮 addEventListener('click', obj.show)（若还想要 obj 而不是 DOM）
     * 修复：() => obj.show() 或 obj.show.bind(obj)
     *
     * ---------- class ----------
     * 类方法处于严格模式，提取后 this 是 undefined
     * 字段箭头 arrow = () => this 绑在实例上，提取后仍指向实例
     *
     * ---------- call vs apply vs bind ----------
     * call(ctx, a, b)     立刻执行，参数逐个传
     * apply(ctx, [a, b])  立刻执行，参数数组
     * bind(ctx, a)        返回新函数，可预置参数；稍后再调或 new
     *
     * 手写 call 原理：把函数临时挂到 ctx 上变成「方法调用」，跑完删掉
     *   ctx[key] = fn; ctx[key](...args)
     * 用 Symbol 当 key，避免覆盖已有属性
     *
     * ---------- bind 后为什么还能 new ----------
     * 规范：bound function 当构造函数用时，bind 绑的 this 作废，
     * 新实例照样走 [[Construct]]，this 指向新对象。
     * 预置参数仍然生效。
     *
     * 手写对应：
     *   const ctx = new.target ? this : boundContext
     * new Bound() 时 new.target 有值，用引擎给的新 this；
     * Bound() 普通调用才用 bind 进来的对象。
     *
     * 还要接原型：boundFn.prototype = Object.create(fn.prototype)
     * 否则 new 出来的实例 instanceof 原构造函数 为 false
     *
     * 口诀：new 的优先级高于 bind。
     *
     * ---------- 和「挂到对象上」的关系 ----------
     * obj.fn() 能得到 this=obj，是因为调用方式是方法调用
     * call 就是人为制造一次「在指定对象上的方法调用」
     */
  </script>
</body>
</html>
