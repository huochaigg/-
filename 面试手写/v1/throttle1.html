<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>throttle 时间戳版</title>
</head>

<body>
  <div id="box1" style="width: 100px; height: 100px; border: 1px solid blue;"></div>
  <script>

    function throttle(fn, delay) {  
      let lastTime = 0
      return function(...args) {
        const now = new Date().getTime()
        if (now - lastTime >= delay) {
          fn.apply(this, args)
          lastTime = now
        }
      }
    }

    function search(value) {
      console.log(value);
    }

    const handler = throttle(search, 1000);
    const box = document.querySelector('#box1')
    box.onclick = () => {
      handler(111111)
    }
  </script>
</body>

</html>
