<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>debounce</title>
</head>
<body>
  <div id="box1" style="width: 100px; height: 100px; border: 1px solid blue;"></div>
  <script>
    function debounce(fn, delay) {
      let timer = null
      return function (...args) {
        if (timer) clearTimeout(timer)
        timer = setTimeout(() => {
          fn.apply(this, args)
        }, delay)
      }
    }

    function search(value) {
      console.log(value);
    }

    const handler = debounce(search, 1000);
    const box = document.querySelector('#box1')
    box.onclick = () => {
      handler(111111)
    }
  </script>
</body>
</html>
